  <g transform="translate(100 650)"><rect width="1400" height="230" rx="28" fill="#0f172a" stroke="#334155"/><text x="40" y="55" fill="#94a3b8" font-size="18" font-weight="800" letter-spacing="3">EXAMPLE OUTPUT</text><rect x="40" y="88" width="260" height="96" rx="16" fill="#172033"/><text x="65" y="125" fill="#94a3b8" font-size="16">CATEGORY</text><text x="65" y="159" fill="#f8fafc" font-size="24" font-weight="750">Identity &amp; Access</text><rect x="325" y="88" width="180" height="96" rx="16" fill="#172033"/><text x="350" y="125" fill="#94a3b8" font-size="16">PRIORITY</text><text x="350" y="161" fill="#60a5fa" font-size="30" font-weight="850">P3</text><rect x="530" y="88" width="280" height="96" rx="16" fill="#172033"/><text x="555" y="125" fill="#94a3b8" font-size="16">ESCALATION</text><text x="555" y="159" fill="#f8fafc" font-size="24" font-weight="750">IAM Support</text><rect x="835" y="88" width="500" height="96" rx="16" fill="#172033"/><text x="860" y="125" fill="#94a3b8" font-size="16">CONTROL</text><text x="860" y="159" fill="#4ade80" font-size="23" font-weight="750">Explainable · Human validated</text></g></g>
</svg>

