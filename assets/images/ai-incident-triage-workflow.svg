<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted IT incident triage workflow</title>
  <desc id="desc">Dark workflow dashboard showing intake, deterministic baseline, optional AI enrichment, validation and human review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111d35"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1410" cy="70" r="310" fill="#2563eb" opacity=".09"/><circle cx="180" cy="930" r="300" fill="#7c3aed" opacity=".08"/>
  <g font-family="Inter,Segoe UI,sans-serif"><text x="110" y="110" fill="#60a5fa" font-size="22" font-weight="800" letter-spacing="4">N8N · IT OPERATIONS · RESPONSIBLE AI</text><text x="110" y="180" fill="#f8fafc" font-size="58" font-weight="800">Incident triage, with a safety baseline.</text><text x="110" y="225" fill="#94a3b8" font-size="24">Explainable classification, priority controls and human review.</text>
  <g transform="translate(100 330)" filter="url(#shadow)"><rect width="260" height="230" rx="26" fill="#111827" stroke="#334155"/><circle cx="48" cy="54" r="22" fill="#2563eb"/><text x="42" y="62" fill="white" font-size="22" font-weight="800">1</text><text x="30" y="112" fill="#f8fafc" font-size="26" font-weight="750">Webhook intake</text><text x="30" y="150" fill="#94a3b8" font-size="18">Sanitized payload</text><text x="30" y="181" fill="#94a3b8" font-size="18">Validation + scope</text></g>
  <path d="M370 445H440" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><path d="m430 430 18 15-18 15" fill="none" stroke="#60a5fa" stroke-width="6"/>
  <g transform="translate(460 330)" filter="url(#shadow)"><rect width="280" height="230" rx="26" fill="#111827" stroke="#334155"/><circle cx="48" cy="54" r="22" fill="#16a34a"/><text x="42" y="62" fill="white" font-size="22" font-weight="800">2</text><text x="30" y="112" fill="#f8fafc" font-size="26" font-weight="750">Safety baseline</text><text x="30" y="150" fill="#94a3b8" font-size="18">Rules + priority floor</text><text x="30" y="181" fill="#4ade80" font-size="18" font-weight="700">No credential required</text></g>
  <path d="M750 445H820" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><path d="m810 430 18 15-18 15" fill="none" stroke="#60a5fa" stroke-width="6"/>
  <g transform="translate(840 330)" filter="url(#shadow)"><rect width="280" height="230" rx="26" fill="#111827" stroke="#334155"/><circle cx="48" cy="54" r="22" fill="url(#accent)"/><text x="42" y="62" fill="white" font-size="22" font-weight="800">3</text><text x="30" y="112" fill="#f8fafc" font-size="26" font-weight="750">AI enrichment</text><text x="30" y="150" fill="#94a3b8" font-size="18">Constrained JSON</text><text x="30" y="181" fill="#fbbf24" font-size="18" font-weight="700">Credential required</text></g>
  <path d="M1130 445H1200" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><path d="m1190 430 18 15-18 15" fill="none" stroke="#60a5fa" stroke-width="6"/>
