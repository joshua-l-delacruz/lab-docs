name: Portfolio bug
description: Report a reproducible portfolio, accessibility, or content-rendering problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit personal data, credentials, client material, or production logs.
  - type: input
    id: page
    attributes:
      label: Page or workspace
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
